
        <!DOCTYPE html>
        <html>
        <head>
            <title>Test Execution Summary</title>
            <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
            <style>
                body { 
                    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                    margin: 0;
                    padding: 20px;
                    background: #ffffff;
                }
                .summary {
                    background: #fff;
                    padding: 15px;
                    border-radius: 4px;
                    margin-bottom: 20px;
                }
                .title {
                    font-size: 24px;
                    color: #333;
                    margin: 0;
                }
                .stats {
                    display: flex;
                    gap: 20px;
                    margin-top: 10px;
                }
                .stat-item {
                    display: flex;
                    align-items: center;
                    gap: 5px;
                }
                .status-dot {
                    width: 12px;
                    height: 12px;
                    border-radius: 50%;
                    display: inline-block;
                }
                .pass { background: #4CAF50; }
                .fail { background: #f44336; }
                .warning { background: #FFC107; }
                table {
                    width: 100%;
                    border-collapse: collapse;
                    background: #fff;
                }
                th, td {
                    padding: 12px;
                    text-align: left;
                    border-bottom: 1px solid #eee;
                }
                th {
                    background: #f5f5f5;
                    font-weight: 600;
                }
                .chart-container {
                    width: 200px;
                    height: 200px;
                }
                .test-name {
                    color: #0066cc;
                    text-decoration: none;
                }
                .test-name:hover {
                    text-decoration: underline;
                }
                .layout {
                    display: flex;
                    gap: 20px;
                    margin-bottom: 20px;
                }
                .table-container {
                    flex-grow: 1;
                }
            </style>
        </head>
        <body>
            <div class="summary">
                <h1 class="title">Test Execution Summary</h1>
                <div class="stats">
                    <div class="stat-item">
                        <span>Test Cases Run: 1</span>
                    </div>
                    <div class="stat-item">
                        <span class="status-dot pass"></span>
                        <span>Passed: 0</span>
                    </div>
                    <div class="stat-item">
                        <span class="status-dot fail"></span>
                        <span>Failed: 1</span>
                    </div>
                </div>
                <p class="execution-time">Execution duration: 00:00:34</p>
            </div>

            <div class="layout">
                <div class="chart-container">
                    <canvas id="resultsPieChart"></canvas>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Test Case</th>
                                <th>Project</th>
                                <th>Start Time</th>
                                <th>Duration</th>
                            </tr>
                        </thead>
                        <tbody>
                            
                                <tr>
                                    <td>
                                        <span class="status-dot fail"></span>
                                        <a href="#Login Check" class="test-name">Login Check</a>
                                    </td>
                                    <td>TestLog_JavaScript</td>
                                    <td>1/9/2025, 10:05:38 pm</td>
                                    <td>34.021s</td>
                                </tr>
                            
                        </tbody>
                    </table>
                </div>
            </div>

            <script>
                const ctx = document.getElementById('resultsPieChart').getContext('2d');
                new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: ['Passed', 'Failed', 'Warnings'],
                        datasets: [{
                            data: [0, 1, 0],
                            backgroundColor: [
                                '#4CAF50',
                                '#f44336',
                                '#FFC107'
                            ],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: {
                                position: 'right'
                            }
                        }
                    }
                });
            </script>
        </body>
        </html>
